name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STACK_VERSION: "3.9.3"

jobs:
  build:
    name: Build and test
    strategy:
      matrix:
        os: [ubuntu-24.04]
        template: [aoc, servant-server-template, cli-template]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install act
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://raw.githubusercontent.com/nektos/act/master/install.sh | bash -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          act --version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Haskell Stack
        id: setup
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: ${{ env.STACK_VERSION }}

      - name: Compute hash for cache key
        id: template-hash
        run: |
          HASH=$(shasum -a 256 ${{ matrix.template }}.hsfiles | awk '{ print $1 }')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Generate a new project from template ${{ matrix.template }}
        run: |
          stack --snapshot lts-24.65 new haskell-toy-example ${{ matrix.template }}

      - name: Lint generated workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color haskell-toy-example/.github/workflows/ci.yml

      - name: Determine GHC version
        id: compiler
        working-directory: haskell-toy-example
        shell: bash
        run: |
          globals=$(stack --lock-file read-write --color never ls globals --global-hints 2>&1)
          ghc_version=$(printf '%s\n' "$globals" | sed -n 's/^ghc-\([0-9][0-9.]*\)$/\1/p')
          test -n "$ghc_version"
          echo "version=$ghc_version" >> "$GITHUB_OUTPUT"

      - name: Restore Stack compiler
        id: stack-compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: &stack-compiler-path |
            ${{ steps.setup.outputs.stack-root }}/programs/*/ghc*-${{ steps.compiler.outputs.version }}
            ${{ steps.setup.outputs.stack-root }}/programs/*/ghc*-${{ steps.compiler.outputs.version }}.installed
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-stack-compiler-${{ env.STACK_VERSION }}-${{ steps.compiler.outputs.version }}

      - name: Restore Stack dependencies
        id: stack-deps-cache
        uses: actions/cache/restore@v6
        with:
          path: &stack-dependency-paths |
            ${{ steps.setup.outputs.stack-root }}/build-plan
            ${{ steps.setup.outputs.stack-root }}/indices
            ${{ steps.setup.outputs.stack-root }}/pantry
            ${{ steps.setup.outputs.stack-root }}/snapshots
          key: stack-deps-${{ runner.os }}-${{ matrix.os }}-${{ env.STACK_VERSION }}-${{ matrix.template }}-${{ steps.template-hash.outputs.hash }}
          restore-keys: |
            stack-deps-${{ runner.os }}-${{ matrix.os }}-${{ env.STACK_VERSION }}-${{ matrix.template }}-

      - name: Install dependencies
        working-directory: haskell-toy-example
        timeout-minutes: 15
        run: stack --lock-file read-write build --test --no-run-tests --only-dependencies

      - name: Save Stack compiler
        if: steps.stack-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *stack-compiler-path
          key: ${{ steps.stack-compiler-cache.outputs.cache-primary-key }}

      - name: Save Stack dependencies
        if: steps.stack-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *stack-dependency-paths
          key: ${{ steps.stack-deps-cache.outputs.cache-primary-key }}

      - name: Build and test generated project and check workflow
        working-directory: haskell-toy-example
        timeout-minutes: 15
        run: |
          stack --lock-file error-on-write test
          act -n -P "${{ matrix.os }}=catthehacker/ubuntu:act-24.04"
