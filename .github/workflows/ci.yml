name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STACK_VERSION: "3.9.3"
  ACT_VERSION: "0.2.94"

jobs:
  build:
    name: Build and test
    strategy:
      matrix:
        os: [ubuntu-latest]
        template: [aoc, servant-server-template, cli-template]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install act
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/nektos/act/v${ACT_VERSION}/install.sh" | bash -s -- -b "$HOME/.local/bin" "v${ACT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/act" --version

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haskell Stack
        id: setup
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: ${{ env.STACK_VERSION }}

      # Resolve the snapshot before hashing the generated build configuration.
      - name: Generate a new project from template ${{ matrix.template }}
        run: stack new haskell-toy-example ${{ matrix.template }}

      - name: Cache Stack programs
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.stack-root }}/programs
          key: stack-programs-v2-${{ matrix.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ hashFiles('haskell-toy-example/stack.yaml', 'haskell-toy-example/stack.yaml.lock') }}
          restore-keys: |
            stack-programs-v2-${{ matrix.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-

      - name: Cache Stack dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.setup.outputs.stack-root }}/build-plan
            ${{ steps.setup.outputs.stack-root }}/indices
            ${{ steps.setup.outputs.stack-root }}/pantry
            ${{ steps.setup.outputs.stack-root }}/snapshots
          key: stack-deps-v2-${{ matrix.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ matrix.template }}-${{ hashFiles('haskell-toy-example/stack.yaml', 'haskell-toy-example/stack.yaml.lock', 'haskell-toy-example/package.yaml', 'haskell-toy-example/*.cabal') }}
          restore-keys: |
            stack-deps-v2-${{ matrix.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ matrix.template }}-

      - name: Build and test generated project
        working-directory: haskell-toy-example
        run: stack test

      - name: Cache act actions
        uses: actions/cache@v5
        with:
          path: ~/.cache/act
          key: act-actions-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ACT_VERSION }}-${{ hashFiles('haskell-toy-example/.github/workflows/**') }}
          restore-keys: |
            act-actions-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ACT_VERSION }}-

      - name: Dry run generated workflow
        working-directory: haskell-toy-example
        # Fetch current refs even on a cache hit, including moved version tags.
        run: act -n --use-new-action-cache --action-cache-path "$HOME/.cache/act" -P ubuntu-latest=catthehacker/ubuntu:act-latest
